<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Antree</title>
  <style>
    html, body, canvas {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden; position: absolute;
      background: black; z-index: 0; outline: none;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #pad { position: fixed; inset: auto 0 0 0; height: 0; z-index: 1; }
    #pad button {
      position: fixed; width: 56px; height: 56px; border-radius: 12px;
      border: 2px solid #e8dcc0; background: rgba(30, 24, 20, 0.55);
      color: #e8dcc0; font: bold 18px monospace; touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #pad button:active { background: rgba(200, 60, 40, 0.7); }
    #pad .up { left: 76px; bottom: 136px; }
    #pad .left { left: 16px; bottom: 76px; }
    #pad .right { left: 136px; bottom: 76px; }
    #pad .down { left: 76px; bottom: 16px; }
    #pad .ok { right: 16px; bottom: 56px; width: 72px; height: 72px; border-radius: 36px; }
    #pad .back { right: 100px; bottom: 16px; }
    #pad .letters { position: fixed; right: 16px; bottom: 144px; display: grid;
      grid-template-columns: repeat(3, 44px); gap: 8px; }
    #pad .letters button { position: static; width: 44px; height: 40px; font-size: 14px; }
    /* Landscape puts the pad over the game, so keep it small and faint. */
    @media (orientation: landscape) {
      #pad { opacity: 0.5; zoom: 0.75; }
    }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <script src="mq_js_bundle.js"></script>
  <script src="sapp_jsutils.js"></script>
  <script src="quad-storage.js"></script>
  <script src="boot.js"></script>
  <script src="pad.js"></script>
</body>
</html>
