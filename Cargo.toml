[package]
name = "antree"
version = "0.1.5"
edition = "2021"
license = "MIT"
description = "A 2D satire game about bureaucracy in the fictional Republik Kuvukiland"

[dependencies]
midly = { version = "0.5", default-features = false, features = ["alloc"] }
macroquad = { version = "0.4", features = ["audio"] }
quad-storage = "0.1.3"
ron = "0.12"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
